<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Checklist de Protocolos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #e11d2e;
            --primary-soft: #ff4d5a;
            --bg: #0f1113;
            --panel: #1a1d21;
            --text: #e0e0e0;
            --muted: #888e96;
            --border: #2d3136;
            --divider: rgba(255, 255, 255, 0.05);
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        body.light-mode {
            --bg: #e5e1da; 
            --panel: #f1ede4; 
            --text: #4a4a4a; 
            --muted: #8c8880;
            --border: #d4cfc5;
            --divider: rgba(0, 0, 0, 0.06);
            --shadow: 0 4px 10px rgba(74, 74, 74, 0.08);
        }

        * { box-sizing: border-box; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            height: 70px;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }

        .layout { display: flex; min-height: calc(100vh - 70px); }

        aside {
            width: 280px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .nav-group { padding: 10px; }

        .nav-item {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--divider);
            padding: 16px 20px;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
        }

        .nav-item:hover {
            background: var(--bg);
            transform: scale(1.03);
            color: var(--primary);
            z-index: 2;
        }

        .nav-item.active {
            background: rgba(225, 29, 46, 0.08);
            color: var(--primary);
            font-weight: 700;
            border-left: 5px solid var(--primary);
        }

        main { flex: 1; padding: 40px; max-width: 1000px; margin: 0 auto; }

        .card {
            background: var(--panel);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: relative;
        }

        .card.checked { 
            opacity: 0.75; 
            background: rgba(0,0,0,0.02); 
            border-color: var(--primary);
            transform: scale(0.98);
        }

        .compact-mode .card { padding: 10px 20px; margin-bottom: 6px; }
        .compact-mode .card textarea { display: none; }

        textarea {
            width: 100%; 
            background: var(--bg); 
            border: 1px solid var(--border);
            border-radius: 10px; 
            color: var(--text); 
            padding: 12px; 
            margin-top: 10px; 
            resize: none; 
            font-family: inherit;
        }

        input[type="checkbox"] { 
            width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer;
        }

        progress { width: 100%; height: 8px; border-radius: 10px; margin-top: 10px; }
        progress::-webkit-progress-bar { background: var(--border); border-radius: 10px; }
        progress::-webkit-progress-value { background: var(--primary); border-radius: 10px; }

        .btn {
            background: var(--primary); color: white; border: none; padding: 12px 24px;
            border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 11px;
        }

        .btn-outline {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 10px; font-weight: 700;
        }

        .theme-toggle {
            cursor: pointer; font-size: 18px; padding: 8px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--bg);
        }

        .view { display: none; }
        .view.active { display: block; animation: popIn 0.35s cubic-bezier(0.17, 0.89, 0.32, 1.28); }

        .radio-box {
            display: flex; gap: 15px; margin-top: 10px; padding: 10px; background: var(--bg); border-radius: 10px;
        }

        .conditional-group {
            border-left: 2px dashed var(--primary); margin-left: 10px; padding-left: 20px; margin-top: 15px; margin-bottom: 15px;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="light-mode">

<header>
    <div style="display: flex; align-items: center; gap: 12px;">
        <img src="icon.png" alt="Logo" style="height: 32px; width: 32px;">
        <div style="font-weight: 800; color: var(--primary); font-size: 18px; letter-spacing: -0.5px;">Checklist de Protocolos</div>
    </div>
    
    <div id="user-header" style="display: none; align-items: center; gap: 15px;">
        <button class="theme-toggle" onclick="toggleTema()">🌓</button>
        <div style="text-align: right;">
            <div id="header-username" style="font-size: 11px; font-weight: 700;"></div>
            <div style="font-size: 9px; color: var(--muted); font-weight: 600;">SESSÃO ATIVA</div>
        </div>
        <img id="header-avatar" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover;">
        <button class="btn-outline" onclick="location.reload()">SAIR</button>
    </div>
</header>

<div class="layout">
    <aside id="sidebar" style="display: none;">
        <nav class="nav-group">
            <button class="nav-item active" id="btn-dash" onclick="irParaDashboard()">
                <span>🏠</span> Dashboard
            </button>
            <button class="nav-item" id="btn-ME" onclick="abrirChecklist('ME')">
                <span>📍</span> Mudança de Endereço
            </button>
            <button class="nav-item" id="btn-PL" onclick="abrirChecklist('PL')">
                <span>📊</span> Atualização de Plano
            </button>
            <button class="nav-item" id="btn-DZ" onclick="abrirChecklist('DZ')">
                <span>🎵</span> Ativação Deezer
            </button>
            <button class="nav-item" id="btn-MX" onclick="abrirChecklist('MX')">
                <span>🎬</span> Ativação Max
            </button>
        </nav>
    </aside>

    <main>
        <div id="view-login" class="view active">
            <div style="max-width: 380px; margin: 80px auto; background: var(--panel); padding: 45px; border-radius: 24px; text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow);">
                <img src="icon.png" style="width: 55px; margin-bottom: 15px;">
                <h2 style="margin: 0; font-size: 22px;">Checklist de Protocolos</h2>
                <input type="text" id="login-name" placeholder="Digite seu nome" style="width: 100%; padding: 15px; margin: 20px 0; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); text-align: center;">
                <button class="btn" style="width: 100%; padding: 18px;" onclick="login()">ENTRAR</button>
            </div>
        </div>

        <div id="view-dash" class="view">
            <div style="background: var(--panel); padding: 40px; border-radius: 24px; border: 1px solid var(--border); text-align: center; box-shadow: var(--shadow);">
                <img id="dash-avatar" style="width: 115px; height: 115px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 15px; object-fit: cover;">
                <h2 id="welcome-name" style="margin: 0; font-size: 28px;"></h2>
                <label style="color: var(--primary); font-size: 11px; cursor: pointer; font-weight: 800; text-transform: uppercase;">Alterar Foto <input type="file" hidden onchange="atualizarFoto(event)"></label>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 35px;">
                    <div style="background: var(--bg); padding: 25px; border-radius: 18px; border: 1px solid var(--border);">
                        <p style="font-size: 10px; color: var(--muted); margin: 0; font-weight: 800;">HOJE</p>
                        <h3 id="count-hoje" style="font-size: 38px; margin: 5px 0;">0</h3>
                    </div>
                    <div style="background: var(--bg); padding: 25px; border-radius: 18px; border: 1px solid var(--border);">
                        <p style="font-size: 10px; color: var(--muted); margin: 0; font-weight: 800;">ACUMULADO</p>
                        <h3 id="count-total" style="font-size: 38px; margin: 5px 0; color: var(--primary);">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <div id="view-app" class="view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <h2 id="checklist-titulo" style="margin: 0; font-size: 24px;"></h2>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-outline" onclick="toggleCompacto()">VISTA COMPACTA</button>
                    <button class="btn-outline" onclick="copiarResumo()">COPIAR</button>
                    <button class="btn" onclick="finalizarAtendimento()">FINALIZAR</button>
                </div>
            </div>
            <div style="background: var(--panel); padding: 20px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 25px; box-shadow: var(--shadow);">
                <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 800;">
                    <span style="color: var(--muted); text-transform: uppercase;">Progresso</span>
                    <span id="pct-texto" style="color: var(--primary)">0%</span>
                </div>
                <progress id="barra-progresso" value="0"></progress>
            </div>
            <div id="lista-itens"></div>
        </div>
    </main>
</div>

<script>
    let usuarioLogado = "";
    let checklistAtual = "";

    // CONFIGURAÇÃO DOS CHECKLISTS
    const subAtivacao = ["Verificar documentação", "Verificar PESSOAS COMPLETO", "Abrir protocolo de atualização de plano no ERP", "Encaminhar para o FAT", "Gerar o contrato", "Encaminhar link de assinatura", "Abrir Renovação de Contrato no ERP", "Encerrar renovação"];
    
    const checklistStreaming = [
        "Verificar plano, endereço, alocados e contatos", 
        "Realizar ID positiva",
        { tipo: "condicional", id: "oferta", texto: "Ofertar atualização para o cliente (caso esteja disponível)", opcoes: {
            sim: subAtivacao,
            nao: []
        }},
        { tipo: "condicional", id: "app", texto: "Verificar se possui acesso ao Virtex App", opcoes: {
            sim: ["Verificar se possui acesso ao email e telefone cadastrados em sistema", "Instruir o acesso pelo Virtex App seguindo o manual disponível", "Verificar se o cliente conseguiu acessar e em quais aparelhos acessou o serviço"],
            nao: ["Recomendar o Virtex App", "Verificar se possui acesso ao email e telefone cadastrados em sistema", "Realizar a ativação remotamente solicitando os códigos ao cliente", "Solicitar que o cliente realize o acesso para verificarmos", "Solicitar que o cliente acesse o serviço", "Verificar se o cliente conseguiu acessar e em quais aparelhos acessou o serviço"]
        }},
        "Abrir o protocolo no ERP", 
        "Conferir o protocolo e enviar para a monitoria (ou encerrar em caso de primeira ativação)", 
        "Concluir o atendimento"
    ];

    const dados = {
        ME: ["Informar taxa/isenção e SLA", "Verificar financeiro", "Verificar documentação", "Informações novo endereço", "Abrir ME no ERP", "Abrir Atualização se isento", "Encaminhar para FAT", "Gerar contrato", "Abrir Renovação após assinatura", "Encerrar Renovação", "Encaminhar para CS"],
        PL: ["Verificar atualização disponível", "Verificar financeiro", "Verificar documentação", "Informar renovação da fidelidade", "Abrir Atualização de Plano", "Encaminhar para FAT", "Enviar vídeo para assinatura", "Gerar contrato", "Abrir Renovação após assinatura", "Encerrar Renovação"],
        DZ: checklistStreaming,
        MX: checklistStreaming
    };

    function toggleTema() {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('tema_p', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    if(localStorage.getItem('tema_p') === 'dark') document.body.classList.remove('light-mode');

    function toggleCompacto() { document.body.classList.toggle('compact-mode'); }

    function login() {
        const nome = document.getElementById("login-name").value.trim();
        if (!nome) return;
        usuarioLogado = nome.toLowerCase();
        if (!localStorage.getItem("up_" + usuarioLogado)) {
            localStorage.setItem("up_" + usuarioLogado, JSON.stringify({ 
                nome: nome, total: 0, hoje: 0, 
                foto: `https://ui-avatars.com/api/?name=${nome}&background=e11d2e&color=fff` 
            }));
        }
        irParaDashboard();
    }

    function irParaDashboard() {
        const data = JSON.parse(localStorage.getItem("up_" + usuarioLogado));
        document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
        document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
        document.getElementById("view-dash").classList.add("active");
        document.getElementById("btn-dash").classList.add("active");
        document.getElementById("sidebar").style.display = "flex";
        document.getElementById("user-header").style.display = "flex";
        document.getElementById("view-login").classList.remove("active");
        document.getElementById("header-username").innerText = data.nome.toUpperCase();
        document.getElementById("header-avatar").src = data.foto;
        document.getElementById("dash-avatar").src = data.foto;
        document.getElementById("welcome-name").innerText = "Olá, " + data.nome;
        document.getElementById("count-hoje").innerText = data.hoje;
        document.getElementById("count-total").innerText = data.total;
    }

    function abrirChecklist(tipo) {
        checklistAtual = tipo;
        document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
        document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
        document.getElementById("view-app").classList.add("active");
        document.getElementById("btn-" + tipo).classList.add("active");
        
        const titulos = { ME: "Mudança de Endereço", PL: "Atualização de Plano", DZ: "Ativação/Reativação Deezer", MX: "Ativação/Reativação Max" };
        document.getElementById("checklist-titulo").innerText = titulos[tipo];

        const container = document.getElementById("lista-itens");
        container.innerHTML = "";

        dados[tipo].forEach((item, idx) => {
            if (typeof item === 'string') {
                container.appendChild(criarCard(item, idx));
            } else {
                container.appendChild(criarCardCondicional(item, idx));
            }
        });
        
        carregarTemp();
        atualizarProgresso();
    }

    function criarCard(texto, idx, isSubItem = false) {
        const div = document.createElement("div");
        div.className = "card";
        div.id = `card-${idx}`;
        if(isSubItem) div.style.marginLeft = "20px";
        
        div.innerHTML = `
            <label style="display: flex; gap: 15px; align-items: center; cursor: pointer;">
                <input type="checkbox" onchange="marcarCard(this, '${idx}')">
                <span style="font-weight: 600; font-size: 14px;">${texto}</span>
            </label>
            <textarea placeholder="Observação..." oninput="salvarTemp()"></textarea>
        `;
        return div;
    }

    function criarCardCondicional(obj, idx) {
        const div = document.createElement("div");
        div.className = "card";
        div.id = `card-cond-${idx}`;
        div.innerHTML = `
            <div style="font-weight: 600; font-size: 14px; margin-bottom: 10px;">${obj.texto}</div>
            <div class="radio-box">
                <label><input type="radio" name="cond-${idx}" onclick="toggleCondicional('${idx}', 'sim')"> SIM</label>
                <label><input type="radio" name="cond-${idx}" onclick="toggleCondicional('${idx}', 'nao')"> NÃO</label>
            </div>
            <div id="cond-container-${idx}" class="conditional-group"></div>
        `;
        return div;
    }

    function toggleCondicional(idx, escolha) {
        const container = document.getElementById(`cond-container-${idx}`);
        container.innerHTML = "";
        const subItens = dados[checklistAtual][idx].opcoes[escolha];
        
        if (subItens && subItens.length > 0) {
            subItens.forEach((texto, sIdx) => {
                container.appendChild(criarCard(texto, `${idx}-${escolha}-${sIdx}`, true));
            });
        }
        atualizarProgresso();
        salvarTemp();
    }

    function marcarCard(input, idx) {
        const card = input.closest('.card');
        if(input.checked) card.classList.add('checked');
        else card.classList.remove('checked');
        salvarTemp(); atualizarProgresso();
    }

    function atualizarProgresso() {
        const checks = document.querySelectorAll("#lista-itens input[type='checkbox']");
        const marcados = [...checks].filter(c => c.checked).length;
        const progresso = document.getElementById("barra-progresso");
        progresso.max = checks.length || 1;
        progresso.value = marcados;
        document.getElementById("pct-texto").innerText = Math.round((marcados / (checks.length || 1)) * 100) + "%";
    }

    function salvarTemp() {
        const checks = {};
        document.querySelectorAll("#lista-itens input[type='checkbox']").forEach(x => {
            const match = x.onchange.toString().match(/'(.*?)'/);
            if(match) checks[match[1]] = x.checked;
        });
        const radios = {};
        document.querySelectorAll("#lista-itens input[type='radio']:checked").forEach(x => {
            radios[x.name] = x.nextSibling.textContent.trim().toLowerCase();
        });
        const notas = {};
        document.querySelectorAll("#lista-itens textarea").forEach((x, i) => {
            notas[i] = x.value;
        });
        localStorage.setItem(`sp_${usuarioLogado}_${checklistAtual}`, JSON.stringify({ checks, radios, notas }));
    }

    function carregarTemp() {
        const save = JSON.parse(localStorage.getItem(`sp_${usuarioLogado}_${checklistAtual}`));
        if (!save) return;
        if(save.radios) {
            for (const [name, val] of Object.entries(save.radios)) {
                const idx = name.split('-')[1];
                const radio = document.querySelector(`input[name="${name}"][onclick*="${val}"]`);
                if (radio) { radio.checked = true; toggleCondicional(idx, val); }
            }
        }
        if(save.checks) {
            for (const [id, checked] of Object.entries(save.checks)) {
                const cb = document.querySelector(`input[onchange*="'${id}'"]`);
                if (cb) { cb.checked = checked; if(checked) cb.closest('.card').classList.add('checked'); }
            }
        }
        if(save.notas) {
            document.querySelectorAll("#lista-itens textarea").forEach((x, i) => x.value = save.notas[i] || "");
        }
        atualizarProgresso();
    }

    function finalizarAtendimento() {
        const checks = document.querySelectorAll("#lista-itens input[type='checkbox']");
        const marcados = [...checks].filter(c => c.checked).length;
        if (marcados < checks.length) {
            if (!confirm(`Atenção: Faltam itens para concluir. Deseja finalizar assim mesmo?`)) return;
        }
        let data = JSON.parse(localStorage.getItem("up_" + usuarioLogado));
        data.total++; data.hoje++;
        localStorage.setItem("up_" + usuarioLogado, JSON.stringify(data));
        localStorage.removeItem(`sp_${usuarioLogado}_${checklistAtual}`);
        confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#e11d2e', '#4a4a4a', '#d4cfc5'] });
        setTimeout(irParaDashboard, 1000);
    }

    function atualizarFoto(e) {
        const reader = new FileReader();
        reader.onload = () => {
            let d = JSON.parse(localStorage.getItem("up_" + usuarioLogado));
            d.foto = reader.result;
            localStorage.setItem("up_" + usuarioLogado, JSON.stringify(d));
            irParaDashboard();
        };
        reader.readAsDataURL(e.target.files[0]);
    }

    function copiarResumo() {
        let r = `RESUMO: ${document.getElementById("checklist-titulo").innerText}\n---\n`;
        document.querySelectorAll("#lista-itens .card").forEach(c => {
            const input = c.querySelector("input[type='checkbox']");
            if (input && input.checked) {
                const span = c.querySelector("span");
                if(span) {
                    r += `[OK] ${span.innerText}\n`;
                    const nota = c.querySelector("textarea").value;
                    if(nota) r += `     Obs: ${nota}\n`;
                }
            }
        });
        navigator.clipboard.writeText(r);
        alert("Resumo copiado com sucesso!");
    }
</script>
</body>
</html>
